name: Telegram reminders

on:
  schedule:
    # Every two hours, 09:20 through 23:20 Kyiv time, including DST.
    - cron: '20 9-23/2 * * *'
      timezone: 'Europe/Kyiv'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check sending window
        id: window
        shell: bash
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          hour=$(TZ=Europe/Kyiv date +%H)
          minute=$(TZ=Europe/Kyiv date +%M)
          echo "Trigger: $TRIGGER_EVENT; Kyiv time: $(TZ=Europe/Kyiv date --iso-8601=seconds)" >> "$GITHUB_STEP_SUMMARY"
          # Allow daytime delays across hour boundaries. Keep all three
          # messages before midnight (ten minutes plus network overhead).
          if (( 10#$hour >= 9 && 10#$hour < 23 )) || (( 10#$hour == 23 && 10#$minute <= 45 )); then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "Sending three reminders." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Outside sending window; skipping." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Send three reminders, five minutes apart
        if: steps.window.outputs.allowed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 bot.py
